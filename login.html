<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="h-screen bg-gradient-to-r from-green-400 to-emerald-600 flex items-center justify-center">

    <img   class="w-100 -mb-35 " src="https://png.pngtree.com/png-clipart/20240326/original/pngtree-indoor-plant-flowerpot-png-image_14685403.png" alt="">

    <div class="w-80 h-90 p-6 bg-white rounded-xl shadow-2xl">
        <h1 class="text-2xl font-bold text-center mb-6 text-green-600">
            LOGIN
        </h1>

        <form class="space-y-4">

            <div>
                <label class="font-medium">Email</label>
                <input
                    type="email"
                    placeholder="Enter Your Email"
                    class="w-full mt-1 p-2 border rounded-md outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <div>
                <label class="font-medium">Password</label>
                <input
                    type="password"
                    placeholder="Enter Your Password"
                    class="w-full mt-1 p-2 border rounded-md outline-none focus:ring-2 focus:ring-green-500">
            </div>

            <button
                class="w-full bg-green-500 text-white p-2 rounded-md hover:bg-green-600 transition">
                Submit
            </button>

        </form>
    </div>

    <img class="w-100 -mb-35 " src="https://png.pngtree.com/png-clipart/20240326/original/pngtree-indoor-plant-flowerpot-png-image_14685403.png" alt="">
<script src="login.js"></script>
</body>
</html>
